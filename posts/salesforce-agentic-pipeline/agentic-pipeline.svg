<svg viewBox="0 0 900 1460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" style="background:#F8FAFC; border-radius:12px; display:block; width:100%; height:auto; min-width:700px;">
  
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="jiraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="8" />

  <!-- Document Header -->
  <text x="40" y="56" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">The Agentic Delivery Pipeline</text>
  <text x="40" y="80" font-size="15" fill="#475569">Four specialized roles, two checkpoints where a human decides, one shared record of truth.</text>
  <line x1="40" y1="100" x2="860" y2="100" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Pipeline Start (Business Request) -->
  <rect x="370" y="120" width="200" height="34" rx="17" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="470" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Business request</text>
  <path d="M470 154 L470 172" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Node 1: Architect (Read-Only) -->
  <rect x="300" y="180" width="340" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow-md)"/>
  <circle cx="300" cy="228" r="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="300" y="234" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">1</text>
  
  <text x="336" y="210" font-size="18" font-weight="700" fill="#0F172A">Architect</text>
  <rect x="560" y="192" width="64" height="24" rx="4" fill="#F1F5F9"/>
  <text x="592" y="209" text-anchor="middle" font-size="12" font-family="monospace" font-weight="600" fill="#475569">/arch</text>
  
  <text x="336" y="234" font-size="13" font-weight="600" fill="#3B82F6">sf-architect subagent, read-only</text>
  <text x="336" y="254" font-size="13" fill="#475569">Options, trade-offs, a recommended design and</text>
  <text x="336" y="270" font-size="13" fill="#475569">the governance questions nobody asked yet.</text>
  
  <path d="M470 276 L470 292" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Checkpoint 1: Design Approval (Human) -->
  <polygon points="470,300 620,336 470,372 320,336" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="470" y="328" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#D97706" text-transform="uppercase">Human decision</text>
  <text x="470" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Is the design approved?</text>
  
  <!-- Return Path 1 (Revise) -->
  <path d="M320 336 L240 336 L240 228 L272 228" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <text x="230" y="292" text-anchor="end" font-size="12" font-weight="600" fill="#D97706">No, revise</text>
  
  <text x="485" y="392" font-size="13" font-weight="700" fill="#475569">Yes</text>
  <path d="M470 372 L470 392" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Shared Record: Jira Bus -->
  <rect x="100" y="400" width="700" height="64" rx="12" fill="url(#jiraGrad)" filter="url(#shadow-md)"/>
  <text x="130" y="428" font-size="16" font-weight="700" fill="#FFFFFF">Jira, the record of truth</text>
  <text x="130" y="448" font-size="13" fill="#94A3B8">Every stage reads status from it and writes status back before handing off.</text>
  
  <path d="M470 464 L470 482" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Node 2: Developer (Write) -->
  <rect x="300" y="490" width="340" height="96" rx="12" fill="#2563EB" filter="url(#shadow-md)"/>
  <circle cx="300" cy="538" r="20" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
  <text x="300" y="544" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
  
  <text x="336" y="520" font-size="18" font-weight="700" fill="#FFFFFF">Developer</text>
  <rect x="560" y="502" width="64" height="24" rx="4" fill="#1E3A8A"/>
  <text x="592" y="519" text-anchor="middle" font-size="12" font-family="monospace" font-weight="600" fill="#93C5FD">/build</text>
  
  <text x="336" y="544" font-size="13" font-weight="600" fill="#93C5FD">sf-dev subagent, the only one that writes</text>
  <text x="336" y="564" font-size="13" fill="#EFF6FF">Scoped to one metadata boundary per run.</text>
  <text x="336" y="580" font-size="13" fill="#EFF6FF">Two agents in the same object XML will collide.</text>
  
  <path d="M470 586 L470 602" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Automated Action: Checks -->
  <rect x="300" y="610" width="340" height="54" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="632" font-size="13" font-weight="700" fill="#334155">Checks fire on their own</text>
  <text x="320" y="650" font-size="12" fill="#64748B">Deploy validation, static analysis, unit tests.</text>
  
  <path d="M470 664 L470 682" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Node 3: Reviewer (Read-Only) -->
  <rect x="300" y="690" width="340" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow-md)"/>
  <circle cx="300" cy="738" r="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="300" y="744" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">3</text>
  
  <text x="336" y="720" font-size="18" font-weight="700" fill="#0F172A">Reviewer</text>
  <rect x="560" y="702" width="64" height="24" rx="4" fill="#F1F5F9"/>
  <text x="592" y="719" text-anchor="middle" font-size="12" font-family="monospace" font-weight="600" fill="#475569">/review</text>
  
  <text x="336" y="744" font-size="13" font-weight="600" fill="#3B82F6">sf-reviewer subagent, read-only</text>
  <text x="336" y="764" font-size="13" fill="#475569">Fresh context, reads the diff, not the chat.</text>
  <text x="336" y="780" font-size="13" fill="#475569">Judges what static analysis cannot see.</text>
  
  <path d="M470 786 L470 802" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Checkpoint 2: Agent Verdict (Automated) -->
  <polygon points="470,810 620,846 470,882 320,846" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" filter="url(#shadow-sm)"/>
  <text x="470" y="838" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#2563EB" text-transform="uppercase">Agent verdict</text>
  <text x="470" y="860" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Any blocking issues?</text>
  
  <!-- Return Path 2 (Rework) -->
  <path d="M320 846 L160 846 L160 472" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="170" y="670" font-size="12" font-weight="700" fill="#2563EB">Rework</text>
  
  <text x="485" y="902" font-size="13" font-weight="700" fill="#475569">None</text>
  <path d="M470 882 L470 902" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Automated Action: Sandbox Tests -->
  <rect x="300" y="910" width="340" height="54" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="932" font-size="13" font-weight="700" fill="#334155">Tests run for real</text>
  <text x="320" y="950" font-size="12" fill="#64748B">sf apex run test against a sandbox. Not an opinion.</text>
  
  <path d="M470 964 L470 982" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Checkpoint 3: Bug Triage (Human) -->
  <polygon points="470,990 620,1026 470,1062 320,1026" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="470" y="1018" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#D97706" text-transform="uppercase">Human decision</text>
  <text x="470" y="1040" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Real bug, accept, or defer?</text>
  
  <!-- Return Path 3 (Real Bug) -->
  <path d="M320 1026 L100 1026 L100 472" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <text x="110" y="740" font-size="12" font-weight="700" fill="#D97706">Real bug</text>
  
  <text x="485" y="1082" font-size="13" font-weight="700" fill="#475569">Accept / defer</text>
  <path d="M470 1062 L470 1082" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Node 4: Documentor (Read-Only) -->
  <rect x="300" y="1090" width="340" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow-md)"/>
  <circle cx="300" cy="1138" r="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="300" y="1144" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">4</text>
  
  <text x="336" y="1120" font-size="18" font-weight="700" fill="#0F172A">Documentor</text>
  <rect x="560" y="1102" width="64" height="24" rx="4" fill="#F1F5F9"/>
  <text x="592" y="1119" text-anchor="middle" font-size="12" font-family="monospace" font-weight="600" fill="#475569">/document</text>
  
  <text x="336" y="1144" font-size="13" font-weight="600" fill="#3B82F6">sf-documentor subagent, read-only</text>
  <text x="336" y="1164" font-size="13" fill="#475569">Release notes in plain language. What the</text>
  <text x="336" y="1180" font-size="13" fill="#475569">feature does, no platform vocabulary.</text>
  
  <path d="M470 1186 L470 1250" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Pipeline End (Success) -->
  <rect x="340" y="1260" width="260" height="42" rx="21" fill="#10B981" filter="url(#shadow-sm)"/>
  <text x="470" y="1286" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Shipped and documented</text>

  <!-- Legend -->
  <rect x="40" y="1340" width="820" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-sm)"/>
  
  <rect x="60" y="1360" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="90" y="1375" font-size="13" font-weight="600" fill="#475569">Read-only subagent</text>
  <text x="90" y="1395" font-size="11" fill="#64748B">No edit tools mapped</text>

  <rect x="250" y="1360" width="20" height="20" rx="6" fill="#2563EB"/>
  <text x="280" y="1375" font-size="13" font-weight="600" fill="#475569">Writing subagent</text>
  <text x="280" y="1395" font-size="11" fill="#64748B">Direct metadata edits</text>

  <polygon points="420,1370 430,1380 420,1390 410,1380" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="445" y="1375" font-size="13" font-weight="600" fill="#475569">Human decision</text>
  <text x="445" y="1395" font-size="11" fill="#64748B">Model never self-approves</text>

  <line x1="600" y1="1355" x2="600" y2="1405" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="620" y="1372" font-size="12" font-weight="600" fill="#334155">Both return paths route back to Jira.</text>
  <text x="620" y="1390" font-size="12" fill="#64748B">The process survives a session crash because</text>
  <text x="620" y="1406" font-size="12" fill="#64748B">context doesn't just live in the chat memory.</text>

</svg>
